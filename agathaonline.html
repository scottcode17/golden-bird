<!DOCTYPE html>
<html>
<head>
<title>You made it to Agatha Online</title>
</head>
<body style="
background-color: white;
border: 17px solid gold; min-height: 100vh; margin: 7px; ">
<h1 style="font-size: 70px; color: gold; text-align: center;">Welcome to Agatha Online</h1>
<button style="background-color: gold; color: white;" onclick="alert('Width: ' + window.innerWidth + ' Height: ' + window.innerHeight)">
    Show size
</button><br>
<button style="background-color: black; color: white;" onclick="document.body.style.backgroundImage = 'none';document.body.style.backgroundColor='black'"> 
    Knight Mode
</button> <br>
<button style="background-color: white; color: gold;" onclick="document.body.style.backgroundImage = 'none'; document.body.style.backgroundColor='white'"> 
    Light Mode
</button> <br>
<script>
let spacemanState = 0;
function SpacemanMode() { 
    if (spacemanState == 0) {
    document.body.style.backgroundImage ='url(https://media.giphy.com/media/8TCVEln7tYe11K67rZ/giphy.gif)';
    document.body.style.backgroundRepeat = 'repeat';
    document.body.style.backgroundSize = 'auto';
    document.body.style.backgroundPosition = 'left';
    spacemanState = 1;
} else {
document.body.style.backgroundImage ='url(https://media.giphy.com/media/8TCVEln7tYe11K67rZ/giphy.gif)';
document.body.style.backgroundSize = 'cover';
document.body.style.backgroundRepeat = 'no-repeat';
document.body.style.backgroundPosition = 'center';
spacemanState = 0;
}
}
</script>
<button style="background-color: darkblue; color: gold;" onclick="SpacemanMode()">
    Spaceman Mode
</button> <br>
<button style="background-color: darkgreen; color: darkred;" onclick="window.location.href = 'index.html'">
    Back to The First Website
</button><br>
<p id="randomnumber" style="display: none;">
    ...
</p>
<div style="margin-top: 0px;">
<button style="background-image: url('https://pre00.deviantart.net/f280/th/pre/f/2010/305/5/7/cod_bo___numbers___by_crazydave55811-d31y1wh.jpg'); background-size: cover; background-position: center; color: crimson;" onclick="randomNumber()">
RNG
</button>
<button id="clearnumber"
style="display: none;"
onclick="clearnumber()">
Clear number
</button>
</div>
<script>
    function randomNumber() {
        let number = Math.floor(Math.random() * 10000000) + 1;
        document.getElementById("randomnumber").style.display = "block";
        document.getElementById("randomnumber").innerHTML = "Random number:" + number;
        document.getElementById("clearnumber").style.display = "inline-block";
        }
function clearnumber() {
        document.getElementById("randomnumber").style.display = "none"
        document.getElementById("clearnumber").style.display = "none"
    }
</script>
<button id="changecursor"
onclick="changecursor()"
style="color: orange;">
    Change cursor
</button>
<img id="spliff"
src="spliffpng.png"
style="display: none;
position: fixed;
width: 50px;
pointer-events: none;">
<script>
    function changecursor() {
        document.body.style.cursor = "none";
        const spliff = document.getElementById("spliff");
        spliff.style.display = "block";
        document.getElementById("revertcursor").style.display = "inline";
        document.addEventListener("mousemove", function(e) {
            spliff.style.left = e.clientX + "px";
            spliff.style.top = e.clientY + "px";
        });
    }
</script>
<button id="revertcursor"
style="display: none;"
onclick="revertcursor()">
    Revert cursor
</button><br>
<script>
    function revertcursor() {
        document.body.style.cursor = "auto";
        document.getElementById("spliff").style.display = "none";
        document.getElementById("revertcursor").style.display = "none";
    }
</script>
<button id="agathanmousebird"
style="display: block; background-color: lightskyblue; color: gold;"
onclick="displaygame()">
Agathan Mouse Bird
</button>
<input id="playerName" type="text" value="Player" maxLength="14" style="margin-top: 10px; padding: 6px;">
<button onclick="saveScore()" style="margin-left: 8px;"> Save Score</button>
<style>
     #gameArea {
        display: none;
        position: relative;
        width: 620px;
        height: 400px;
        border: 4px solid gold;
        margin: 20px auto;
        background: linear-gradient(#87ceeb, #dff6ff);
    }
    canvas {
        display:block;
        width: 100%;
        height:auto;
    }
</style>
<div id="gameArea">
    <canvas id="gameCanvas" width="620" height="400"></canvas>
    </div>
    <script>
        const gameArea = document.getElementById("gameArea");
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const birdImage = new Image();
        birdImage.src = "Agathanmousebird.png";
        let running = false;
        let bird = { x: 120, y: 180, radius: 18, velocityY: 0 };
        let pipes = [];
        let score = 0;
        let gameOver = false;
        let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
        let basePipeSpeed = 3;
        let maxPipeSpeed = 17;

        canvas.addEventListener("mousemove", function(e) {
            const rect = canvas.getBoundingClientRect();
            mouse.x = e.clientX - rect.left;
            mouse.y = e.clientY - rect.top;
        });

        canvas.addEventListener("click", function() {
            if (gameOver) {
                resetGame();
                running = true;
                requestAnimationFrame(gameLoop);
            }
        });

        function resetGame() {
           bird = {
            x: 120,
            y:200,
            radius: 18,
            velocityY: 0
            };

            pipes = [];
            score = 0;
            lastPipe = 0;
            gameOver = false;
        }

        function displaygame() {
            gameArea.style.display = "block";
            document.getElementById("agathanmousebird").style.display = "none";
            if (!running) {
                resetGame();
                running = true;
                requestAnimationFrame(gameLoop);
            }
        }

        function spawnPipe() {
            const gap = 130;
            const topHeight = 50 + Math.random() * (canvas.height - gap - 100);

            pipes.push({
                x: canvas.width + 30,
                width: 60,
                topHeight: topHeight,
                gap: gap,
                passed: false
            });
        }

        function update() {
            if (!running) return;

            bird.x += (mouse.x - bird.x) * 0.2;
            bird.y += (mouse.y - bird.y) * 0.2;

            if (performance.now() - lastPipe > 1400) {
                spawnPipe();
                lastPipe = performance.now();
            }

            for (const pipe of pipes) {
                const pipeSpeed = Math.min(basePipeSpeed + score * 0.08, maxPipeSpeed);
                pipe.x -= pipeSpeed;
                if (!pipe.passed && pipe.x + pipe.width < bird.x) {
                    score++;
                    pipe.passed = true;
                }
                const birdLeft = bird.x - bird.radius;
                const birdRight = bird.x + bird.radius;
                const birdTop = bird.y - bird.radius;
                const birdBottom = bird.y + bird.radius;

                const pipeLeft = pipe.x;
                const pipeRight = pipe.x + pipe.width;
                const topBottom = pipe.topHeight;
                const bottomTop = pipe.topHeight + pipe.gap;

                const hitPipe =
                    birdRight > pipeLeft &&
                    birdLeft < pipeRight &&
                    (birdTop < topBottom || birdBottom > bottomTop);

                if(hitPipe || bird.y < 0 || bird.y > canvas.height) {
                    running = false;
                    gameOver = true;
                    draw();
                    setTimeout(function() {
                        alert("Flight over. Score: " + score);
                    }, 50);
                }
            }

            pipes = pipes.filter(pipe => pipe.x + pipe.width > -10);
        }

        function drawBackground() {
            ctx.fillStyle = "#87ceeb";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#fff";
            ctx.beginPath();
            ctx.arc(80, 70, 30, 0, Math.PI * 2);
            ctx.fill();

            ctx.beginPath()
            ctx.arc(140, 80, 25, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawbird() {
            const size = 77;

            if (birdImage.complete && birdImage.naturalWidth > 0) {
                ctx.drawImage(
                    birdImage,
                    bird.x - size / 2,
                    bird.y - size / 2,
                    size, size
                );
                return;
         }
        }

        function drawPipes() {
            for (const pipe of pipes) {
                ctx.fillStyle = "#2ca02c";
                ctx.fillRect(pipe.x, 0, pipe.width, pipe.topHeight);
                ctx.fillRect(pipe.x, pipe.topHeight + pipe.gap, pipe.width, canvas.height - (pipe.topHeight + pipe.gap));

            }
        }

        function drawScore() {
            ctx.fillStyle = "#000";
            ctx.font = "24px Arial";
            ctx.fillText("Score: " + score, 20, 30);
        }

        function draw() {
            drawBackground();
            drawPipes();
            drawbird();
            drawScore();

            if (gameOver) {
                ctx.fillStyle ="rgba(0, 0, 0, 0.5)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#fff";
                ctx.font = "38px Arial";
                ctx.fillText("Flight Over.", canvas.width / 2 - 105, canvas.height / 2 - 10);

                ctx.font = "22px Arial";
                ctx.fillText("Click to restart.", canvas.width / 2 - 120, canvas.height / 2 + 30);
            }
        }

        function gameLoop() {
            if (running) {
                update();
                draw();
                requestAnimationFrame(gameLoop);
            } else {
                draw();
            }
        }
    </script>
    <script>
        function saveScore() {
            const input = document.getElementById("playerName");
            const name = (input.value || "Player").trim() || "Player";
            const scores = JSON.parse(localStorage.getItem("birdScores") || "[]");

            scores.push({
                name: name,
                score: score
            })

            scores.sort((a, b) => b.score - a.score);
            const topTen = scores.slice(0, 10);

            localStorage.setItem("birdScores", JSON.stringify(topTen));
            alert("Score saved. Check the Archives for the top scores.");
        }
    </script>
</body>
</html>
